<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    h1 {
      font-size: 2.5rem;
      color: #ff4b5c;
      margin-bottom: 20px;
      animation: pop 1s ease forwards;
    }

    p {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 30px;
      line-height: 1.6;
      animation: slideUp 1.5s ease forwards;
    }

    button {
      padding: 10px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 50px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    button:hover {
      transform: scale(1.1);
      background: #ff6b81;
    }

    /* Animations */
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes slideUp {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>I'm Sorry 💌</h1>
    <p id="message">I didn’t mean to hurt you. Please forgive me, I promise to do better. Your happiness means everything to me.</p>
    <button onclick="changeMessage()">Another Sorry Message</button>
  </div>

  <script>
    const messages = [
      "I'm really sorry. I never wanted to upset you.",
      "Please forgive me for my mistake. I care about you a lot.",
      "I feel terrible for what happened. I hope we can move past this.",
      "I apologize from the heart. I will make it up to you.",
      "I'm sorry if I hurt you. Your feelings matter to me."
    ];

    function changeMessage() {
      const msgElement = document.getElementById('message');
      const randomIndex = Math.floor(Math.random() * messages.length);
      msgElement.textContent = messages[randomIndex];
      msgElement.style.opacity = 0;
      setTimeout(() => {
        msgElement.style.opacity = 1;
      }, 100);
    }
  </script>
</body>
